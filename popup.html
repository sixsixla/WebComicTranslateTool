<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 14px;
      color: #333;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
      color: #1a73e8;
    }
    .section {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: bold;
      font-size: 12px;
      color: #666;
    }
    select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:hover {
      background: #1557b0;
    }
    button.secondary {
      background: #fff;
      color: #1a73e8;
      border: 1px solid #1a73e8;
    }
    button.secondary:hover {
      background: #e8f0fe;
    }
    .status {
      font-size: 12px;
      color: #999;
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <h1>🎨 WebComicTranslate</h1>

  <div class="section">
    <label>源语言（OCR）</label>
    <select id="sourceLang">
      <option value="jpn">日语</option>
      <option value="eng">英语</option>
      <option value="kor">韩语</option>
      <option value="chi_sim">中文</option>
    </select>
  </div>

  <div class="section">
    <label>目标语言</label>
    <select id="targetLang">
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁体中文</option>
      <option value="en">英语</option>
      <option value="ja">日语</option>
      <option value="ko">韩语</option>
    </select>
  </div>

  <button id="translateCurrent">翻译当前图片 (右键选中)</button>
  <button id="translateAll" class="secondary">翻译页面全部图片</button>

  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
